name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate icon assets
        run: python3 -m pip install --quiet Pillow && python3 scripts/make_icons.py

      - name: Build .deb (Debian/Ubuntu)
        run: bash scripts/build-deb.sh

      - name: Build .rpm (Fedora/RHEL/openSUSE)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm
          bash scripts/build-rpm.sh

      - name: Check if release already exists
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release and upload assets
        if: steps.existing.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/deb/volume-booster_*.deb
            build/rpm/RPMS/noarch/volume-booster-*.rpm
          generate_release_notes: true
